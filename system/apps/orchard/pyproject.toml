[project]
name = "orchard"
version = "0.1.0"
description = "Candidate sourcing and templated multi-inbox outreach with open tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "pydantic>=2.0",
]

[project.scripts]
orchard = "orchard.runner:main"
orchard-pixel = "orchard.pixel_runner:main"
orchard-tunnel = "orchard.tunnel_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchard"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Orchard: a recruiter's candidate pipeline with templated, multi-inbox outreach and email open-tracking">
  <rect width="240" height="160" rx="12" fill="#F7F5EC"/>

  <!-- apple mark + wordmark -->
  <path d="M22 30.4c-1.2-2.2-3.6-2.9-5.3-1.9-2.1 1.2-2.7 4.2-1.7 7.2.8 2.4 2.2 4.6 3.8 5.4 1 .5 1.8.2 3.2.2s2.2.3 3.2-.2c1.6-.8 3-3 3.8-5.4 1-3 .4-6-1.7-7.2-1.7-1-4.1-.3-5.3 1.9Z" fill="#C0504A"/>
  <path d="M22.5 30.1c.1-2 1.5-3.5 3.4-3.7" stroke="#4E9A55" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <text x="38" y="36" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#8C8794">orchard</text>

  <!-- candidate table card -->
  <rect x="16" y="52" width="208" height="92" rx="10" fill="#FFFFFF" stroke="#E6EBD9"/>
  <line x1="16" y1="74" x2="224" y2="74" stroke="#E6EBD9"/>
  <text x="26" y="66" font-family="sans-serif" font-size="8" letter-spacing="1" fill="#A9A398">CANDIDATE</text>
  <text x="120" y="66" font-family="sans-serif" font-size="8" letter-spacing="1" fill="#A9A398">EMAIL</text>
  <text x="178" y="66" font-family="sans-serif" font-size="8" letter-spacing="1" fill="#A9A398">STAGE</text>

  <!-- row 1: reached out (amber) -->
  <circle cx="30" cy="87" r="8" fill="#F7EEDA"/>
  <text x="30" y="90" font-family="sans-serif" font-size="8" fill="#C58A2C" text-anchor="middle">MK</text>
  <rect x="46" y="83" width="58" height="8" rx="4" fill="#EFEAD9"/>
  <rect x="120" y="83" width="46" height="8" rx="4" fill="#EFEAD9"/>
  <circle cx="184" cy="87" r="4" fill="#C58A2C"/>
  <rect x="192" y="83" width="26" height="8" rx="4" fill="#F7EEDA"/>

  <!-- row 2: replied (green) -->
  <circle cx="30" cy="109" r="8" fill="#E6F2E1"/>
  <text x="30" y="112" font-family="sans-serif" font-size="8" fill="#4E9A55" text-anchor="middle">JT</text>
  <rect x="46" y="105" width="70" height="8" rx="4" fill="#EFEAD9"/>
  <rect x="120" y="105" width="46" height="8" rx="4" fill="#EFEAD9"/>
  <circle cx="184" cy="109" r="4" fill="#4E9A55"/>
  <rect x="192" y="105" width="22" height="8" rx="4" fill="#E6F2E1"/>

  <!-- row 3: not contacted (neutral) -->
  <circle cx="30" cy="131" r="8" fill="#F0F4E7"/>
  <text x="30" y="134" font-family="sans-serif" font-size="8" fill="#8C8794" text-anchor="middle">RS</text>
  <rect x="46" y="127" width="50" height="8" rx="4" fill="#EFEAD9"/>
  <rect x="120" y="127" width="30" height="8" rx="4" fill="#EFEAD9"/>
  <circle cx="184" cy="131" r="4" fill="#D8D2C4"/>
  <rect x="192" y="127" width="30" height="8" rx="4" fill="#F0F4E7"/>
</svg>
